name: Build PrimeGram IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Import certificates
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build app
        run: |
          mkdir -p build/artifacts
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath=build/artifacts \
            --buildNumber=100001

      - name: List artifacts
        run: |
          ls -la build/artifacts || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrimeGram-IPA
          path: build/artifacts/*.ipa
